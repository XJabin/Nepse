name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true 

      - name: Install Git LFS
        run: |
          git lfs install

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Hugging Face मा पुश गर्नको लागि जरुरी सेटिङ
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # .db फाइललाई LFS मा ट्र्याक गर्ने ताकि HF ले रिजेक्ट नगरोस्
          git lfs track "*.db"
          git add .gitattributes
          
          # Force push to Hugging Face
          git push --force https://XJabin:$HF_TOKEN@huggingface.co/spaces/XJabin/NEPSE-Predictor main