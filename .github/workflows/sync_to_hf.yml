name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install HF Hub
        run: pip install huggingface_hub

      - name: Upload to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          repo_id = 'XJabin/NEPSE-Predictor' 
          try:
              api.upload_file(
                  path_or_fileobj='nepse_data.db',
                  path_in_repo='nepse_data.db',
                  repo_id=repo_id,
                  repo_type='space',
                  token=os.environ['HF_TOKEN']
              )
              print('✅ Database successfully uploaded to HF Space!')
          except Exception as e:
              print(f'❌ Failed: {e}')
              exit(1)
          "