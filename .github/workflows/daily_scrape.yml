name: Daily NEPSE Scraper

on:
  schedule:
    - cron: '0 10 * * *' 
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl lxml huggingface_hub
          python -m playwright install chromium --with-deps

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nepse_data.db
          git commit -m "Daily data update [skip ci]" || exit 0
          git push

      - name: Upload Database to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          try:
              api.upload_file(
                  path_or_fileobj='nepse_data.db',
                  path_in_repo='nepse_data.db',
                  repo_id='XJabin/nepse-lstm-model',
                  repo_type='model',
                  token='${{ secrets.HF_TOKEN }}'
              )
              print('✅ Successfully uploaded to Hugging Face!')
          except Exception as e:
              print(f'❌ HF Upload Failed: {e}')
          "